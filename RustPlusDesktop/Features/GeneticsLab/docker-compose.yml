services:
  genetics-lab:
    build:
      context: .
      dockerfile: Dockerfile
    image: genetics-lab:latest
    container_name: genetics-lab
    restart: unless-stopped
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    labels:
      - "coolify.managed=true"
