server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security & Feature Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Allow camera & screen capture for the Genetics OCR scanner
    add_header Permissions-Policy "camera=(self), display-capture=(self)" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        application/xml
        application/xml+rss
        application/wasm
        image/svg+xml;

    # Ensure correct MIME type for WebAssembly and Tesseract assets
    include /etc/nginx/mime.types;
    types {
        application/wasm wasm;
        application/gzip gz;
    }

    # Healthcheck endpoint for Coolify / Docker health monitoring
    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # Hashed build assets (JS, CSS, fonts) - Cache for 1 year immutable
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Tesseract OCR WebAssembly binaries and language datasets
    location ^~ /tesseract/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
        access_log off;
    }

    # Static media assets (Images, Icons, Sound effects)
    location ~* \.(?:webp|png|jpg|jpeg|gif|svg|ico|mp3|wav|ogg)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Never cache index.html so updates are visible instantly
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Single Page Application (SPA) routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Return 404 for missing hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
