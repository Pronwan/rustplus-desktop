name: Sync downstream branches with beta

# Keeps long-running feature branches up to date with beta.
# On every push to beta, each branch in the matrix has beta merged into it
# and is pushed. A merge conflict fails that branch's job loudly (nothing is
# force-pushed) so it can be resolved by hand; other branches still sync.
# Add a new long-running branch by adding it to the matrix below.

on:
  push:
    branches: [beta]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-downstream
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch:
          - net10-upgrade
          - native-fcm-listener
    steps:
      - name: Checkout ${{ matrix.branch }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge beta into ${{ matrix.branch }}
        run: |
          git fetch origin beta
          git merge --no-edit origin/beta

      - name: Push ${{ matrix.branch }}
        run: git push origin ${{ matrix.branch }}
