name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version. Leave empty to use the RustPlusDesk.csproj version."
        required: false
        type: string
      mapparser_repository:
        description: "Repository to checkout into ./vendor/MapParser."
        required: true
        default: "Pronwan/MapParser"
        type: string
      mapparser_ref:
        description: "MapParser branch, tag, or SHA."
        required: true
        default: "main"
        type: string
      geneticslab_release:
        description: "Genetics Lab release to bundle from JawadYzbk/rust-genetics-lab (e.g. v1.8.0), 'latest', or 'source' to build the copy in this repo."
        required: false
        default: "latest"
        type: string
      create_github_release:
        description: "Create or update a GitHub Release with installer artifacts."
        required: true
        default: true
        type: boolean
      prerelease:
        description: "Mark the GitHub Release as a prerelease."
        required: true
        default: false
        type: boolean

permissions:
  contents: write

env:
  DOTNET_VERSION: "8.0.x"
  CONFIGURATION: "Release"
  RUNTIME_IDENTIFIER: "win-x64"
  APP_PROJECT: "src/RustPlusDesktop/RustPlusDesk.csproj"
  PUBLISH_DIR: "${{ github.workspace }}/src/RustPlusDesktop/bin/Installer/publish"
  VELOPACK_OUTPUT_DIR: "${{ github.workspace }}/artifacts/velopack"
  VELOPACK_ID: "RustPlusDesk"

jobs:
  release:
    name: Build packages and installer
    runs-on: windows-latest

    steps:
      - name: Checkout rustplus-desktop
        uses: actions/checkout@v4

      - name: Checkout RustPlus.Auth (Private Submodule)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: 'JawadYzbk/rustplus-auth-private'
          ref: 'main'
          token: ${{ secrets.AUTH_SUBMODULE_TOKEN || secrets.MAP_PARSER_TOKEN || secrets.GITHUB_TOKEN }}
          path: vendor/RustPlus.Auth

      - name: Checkout MapParser
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.mapparser_repository || 'Pronwan/MapParser' }}
          ref: ${{ inputs.mapparser_ref || 'main' }}
          token: ${{ secrets.MAP_PARSER_TOKEN || secrets.GITHUB_TOKEN }}
          path: vendor/MapParser

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            vendor/MapParser/package-lock.json
            src/RustPlusDesktop/Features/GeneticsLab/package-lock.json

      # The installer ships the newest published Genetics Lab build. Installed apps then
      # keep themselves current from rust-genetics-lab's `dist` branch (or the hosted
      # site), downloading only changed files, so this copy is just the starting point.
      - name: Get GeneticsLab build
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GENETICSLAB_RELEASE: ${{ inputs.geneticslab_release || 'latest' }}
        run: |
          $labDir = "src/RustPlusDesktop/Features/GeneticsLab"
          $dist = Join-Path $labDir "dist"
          $bundled = $false

          if ($env:GENETICSLAB_RELEASE -ne "source") {
            $download = Join-Path $env:RUNNER_TEMP "geneticslab"
            New-Item -ItemType Directory -Force -Path $download | Out-Null
            $ghArgs = @("release", "download")
            if ($env:GENETICSLAB_RELEASE -ne "latest") { $ghArgs += $env:GENETICSLAB_RELEASE }
            $ghArgs += @("--repo", "JawadYzbk/rust-genetics-lab", "--pattern", "genetics-lab-dist.zip", "--dir", $download, "--clobber")
            gh @ghArgs

            $zip = Join-Path $download "genetics-lab-dist.zip"
            if ($LASTEXITCODE -eq 0 -and (Test-Path -LiteralPath $zip)) {
              $extract = Join-Path $download "dist"
              Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force
              # Releases from before the update manifest cannot seed partial updates.
              if (Test-Path -LiteralPath (Join-Path $extract "genetics-lab-manifest.json")) {
                if (Test-Path -LiteralPath $dist) { Remove-Item -LiteralPath $dist -Recurse -Force }
                Move-Item -LiteralPath $extract -Destination $dist
                $bundled = $true
              } else {
                Write-Warning "Genetics Lab release $($env:GENETICSLAB_RELEASE) has no update manifest; building from source."
              }
            } else {
              Write-Warning "Could not download Genetics Lab release $($env:GENETICSLAB_RELEASE); building from source."
            }
          }

          if (-not $bundled) {
            Push-Location $labDir
            npm ci
            if ($LASTEXITCODE -ne 0) { throw "npm ci failed" }
            npm run build
            if ($LASTEXITCODE -ne 0) { throw "Genetics Lab build failed" }
            Pop-Location
          }

      - name: Verify GeneticsLab update manifest
        shell: pwsh
        run: |
          $manifestPath = "src/RustPlusDesktop/Features/GeneticsLab/dist/genetics-lab-manifest.json"
          if (-not (Test-Path -LiteralPath $manifestPath)) {
            throw "$manifestPath is missing; the GeneticsLab build must run scripts/generate-update-manifest.mjs."
          }
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          Write-Host "Bundling Genetics Lab v$($manifest.version) ($($manifest.files.Count) files, build $($manifest.buildId.Substring(0, 12)))"

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"

          if ([string]::IsNullOrWhiteSpace($version) -and "${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
          }

          if ([string]::IsNullOrWhiteSpace($version)) {
            [xml]$project = Get-Content -LiteralPath "${{ env.APP_PROJECT }}"
            $version = $project.Project.PropertyGroup.Version |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) } |
              Select-Object -First 1
          }

          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Could not resolve a package version."
          }

          $tag = "v$version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Create build .env
        shell: pwsh
        env:
          OVERLAY_SYNC_SECRET_HEX: ${{ secrets.OVERLAY_SYNC_SECRET_HEX }}
          OVERLAY_SYNC_BASEURL: ${{ secrets.OVERLAY_SYNC_BASEURL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CLOUD_API_BASEURL: ${{ vars.CLOUD_API_BASEURL || secrets.CLOUD_API_BASEURL || 'https://rustplusdesktop.cloud' }}
        run: |
          $required = @(
            "OVERLAY_SYNC_SECRET_HEX",
            "OVERLAY_SYNC_BASEURL",
            "SUPABASE_URL",
            "SUPABASE_ANON_KEY",
            "CLOUD_API_BASEURL"
          )

          $missing = $required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
          if ($missing.Count -gt 0) {
            throw "Missing required GitHub Actions secrets: $($missing -join ', ')"
          }

          @"
          OVERLAY_SYNC_SECRET_HEX=$env:OVERLAY_SYNC_SECRET_HEX
          OVERLAY_SYNC_BASEURL=$env:OVERLAY_SYNC_BASEURL
          SUPABASE_URL=$env:SUPABASE_URL
          SUPABASE_ANON_KEY=$env:SUPABASE_ANON_KEY
          CLOUD_API_BASEURL=$env:CLOUD_API_BASEURL
          "@.Trim() | Set-Content -LiteralPath ".env" -Encoding UTF8

      - name: Publish Windows app
        run: >
          dotnet publish "${{ env.APP_PROJECT }}"
          --configuration "${{ env.CONFIGURATION }}"
          --runtime "${{ env.RUNTIME_IDENTIFIER }}"
          --self-contained true
          --output "${{ env.PUBLISH_DIR }}"
          -p:Version="${{ env.VERSION }}"
          -p:PublishSingleFile=false
          -p:PublishReadyToRun=false
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishDocumentationFiles=false
          -p:GenerateDocumentationFile=false
          -p:SkipGeneticsLabBuild=true

      - name: Build Velopack release
        shell: pwsh
        run: |
          dotnet tool update -g vpk --version 1.2.0
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          New-Item -ItemType Directory -Force -Path "${{ env.VELOPACK_OUTPUT_DIR }}" | Out-Null

          vpk download github `
            --repoUrl "https://github.com/${{ github.repository }}" `
            --outputDir "${{ env.VELOPACK_OUTPUT_DIR }}" `
            --token "${{ secrets.GITHUB_TOKEN }}"

          vpk pack `
            --packId "${{ env.VELOPACK_ID }}" `
            --packVersion "${{ env.VERSION }}" `
            --packDir "${{ env.PUBLISH_DIR }}" `
            --mainExe "RustPlusDesk.exe" `
            --outputDir "${{ env.VELOPACK_OUTPUT_DIR }}" `
            --icon "src/RustPlusDesktop/Assets/rustplus-desktop-icon.ico" `
            --packAuthors "Pronwan" `
            --packTitle "RustPlusDesk" `
            --noPortable `
            --delta BestSize

          # The downloaded previous full package is only needed while creating the delta.
          Get-ChildItem -Path "${{ env.VELOPACK_OUTPUT_DIR }}" -Filter "${{ env.VELOPACK_ID }}-*-full.nupkg" -File |
            Where-Object Name -ne "${{ env.VELOPACK_ID }}-${{ env.VERSION }}-full.nupkg" |
            Remove-Item

          # Rename the Velopack installer to match legacy naming (so old apps find it)
          if (Test-Path "${{ env.VELOPACK_OUTPUT_DIR }}/RustPlusDesk-win-Setup.exe") {
              Rename-Item -Path "${{ env.VELOPACK_OUTPUT_DIR }}/RustPlusDesk-win-Setup.exe" -NewName "RustPlusDesk-Setup.exe"
          }

      - name: Upload build artifacts
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.create_github_release }}
        uses: actions/upload-artifact@v4
        with:
          name: rustplusdesk-${{ env.VERSION }}-release-artifacts
          path: |
            ${{ env.VELOPACK_OUTPUT_DIR }}/**
          if-no-files-found: error
          compression-level: 0

      - name: Create or update GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_github_release }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $title = "Rust+ Desktop ${{ steps.version.outputs.version }}"
          $notesFile = ".github/release-notes.md"

          if (-not (Test-Path -LiteralPath $notesFile)) {
            Write-Host "Generating release notes from commits..."
            node tools/release/bump-version.mjs --generate-notes-only --to-ref=$tag
          }

          $assets = @(
            Get-ChildItem -Path "${{ env.VELOPACK_OUTPUT_DIR }}" -File -Recurse
          ) | Select-Object -ExpandProperty FullName -Unique

          $prerelease = "${{ inputs.prerelease }}" -eq "true"
          $releaseExists = $false
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            $releaseExists = $true
          }

          if (-not $releaseExists) {
            $args = @("release", "create", $tag, "--target", "${{ github.sha }}", "--title", $title)
            if (Test-Path -LiteralPath $notesFile) {
              $args += @("--notes-file", $notesFile)
            } else {
              $args += @("--notes", "Automated Rust+ Desktop release for $tag.")
            }
            if ($prerelease) { $args += "--prerelease" }
            gh @args
          } else {
            if (Test-Path -LiteralPath $notesFile) {
              gh release edit $tag --notes-file $notesFile
            }
          }

          gh release upload $tag @assets --clobber
