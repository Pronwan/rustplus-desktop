name: UI color gate

# Fails if the number of hardcoded hex colors in XAML increases beyond the
# stored baseline (RustPlusDesktop/Scripts/hardcoded-colors.baseline).
# Part of the Fluent-UI modernization (docs/UI-Review-Fluent-Audit.md, Phase 0).

on:
  pull_request:
    paths:
      - '**/*.xaml'
      - 'RustPlusDesktop/Scripts/check-hardcoded-colors.ps1'
      - 'RustPlusDesktop/Scripts/hardcoded-colors.baseline'
  push:
    branches: [ master, beta ]
    paths:
      - '**/*.xaml'

jobs:
  color-gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check hardcoded colors
        shell: pwsh
        run: pwsh -NoProfile -File RustPlusDesktop/Scripts/check-hardcoded-colors.ps1
