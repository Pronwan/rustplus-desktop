name: Cross-platform build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build RustPlusDesk.CrossPlatform.sln --configuration Release
      - name: Test
        run: dotnet test tests/RustPlusDesk.CrossPlatform.Tests --configuration Release --no-build
      - name: Publish preview
        run: dotnet publish src/RustPlusDesk.Avalonia --configuration Release --runtime ${{ matrix.rid }} --self-contained true --output artifacts/${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: rustplus-preview-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}
